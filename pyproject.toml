[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-alrtbot"
version = "1.0.0"
description = "Deterministic crypto futures signal generator for Binance perpetual futures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Crypto-AlrtBot Team"}
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/Crypto-AlrtBot"
Repository = "https://github.com/yourusername/Crypto-AlrtBot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# F only (pyflakes): undefined names, unused imports/variables, shadowed definitions —
# real bugs, not style. Note this narrows ruff's default set, so E9 (syntax errors) is no
# longer reported; add "E9" here if a parse error ever needs to fail a check.
# shortcut: F only until the 68 existing findings are cleared, then widen to E4/E7/E9.
select = ["F"]